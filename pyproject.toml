[project]
name = "redactor"
version = "0.1.0"
description = "Finds erasure poems hidden in web pages and blacks out the rest"
requires-python = ">=3.11"
dependencies = [
    "trafilatura>=1.12",
    "pronouncing>=0.2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
pos = ["spacy>=3.7"]
render = []
llm = ["anthropic>=0.40"]

[project.scripts]
redactor = "redactor.cli:main"
redactor-agent = "redactor.run:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redactor"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Correctness first, style only where it is mechanical. The families here were
# each chosen because they caught something real on this codebase: B023 found
# closures over loop variables, PLW1510 found ImageMagick failures going
# unnoticed, BLE001 found excepts wide enough to swallow a typo.
select = ["E", "F", "I", "B", "UP", "RUF", "FURB", "BLE", "RET", "ISC",
          "PLW", "PLE", "C4", "SIM"]
# Bandit's family is left out on purpose. This program fetches arbitrary URLs
# and samples poems with `random`, so its findings here are the design, and a
# linter that reports the design teaches you to stop reading it.
ignore = ["E501"]   # long lines are the formatter's business

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
