name: ci

on:
  push:
    branches: [main]
  pull_request:

# This job reads the repo and reports a result. It writes nothing, so it is
# given nothing: a public repo runs this workflow for anyone's pull request.
permissions:
  contents: read

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole job takes about thirty seconds. Anything approaching this is
    # hung, and the default without it is six hours of runner time.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor the project claims in pyproject, and the current release.
        # Anything between them is covered by whichever of these breaks first.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install ${{ matrix.python }}

      # --locked refuses to resolve: if uv.lock disagrees with pyproject the
      # job fails here rather than quietly installing something else.
      - name: Install
        run: uv sync --locked --group dev --python ${{ matrix.python }}

      # The render tests want ImageMagick 7, whose binary is `magick`. Ubuntu
      # ships 6, which has no such binary, so those tests skip and say so.
      # Printed rather than assumed, because a silent skip reads like a pass.
      - name: Report optional tools
        run: |
          magick -version || echo "no ImageMagick 7: render tests will skip"
          tesseract --version || echo "no Tesseract: OCR tests will skip"

      # `just check` and not the commands themselves. The recipes are what the
      # pre-commit and pre-push hooks run, so sharing them is what keeps a
      # green local push and a green CI run meaning the same thing.
      - name: Install just
        run: uv tool install rust-just

      - name: Check
        run: just check
